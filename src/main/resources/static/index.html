<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ledgr — Native Desktop Application</title>
    <style>
        body {
            background-color: #0d1117;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background-color: #131b2a;
            border: 1px solid #1f2b40;
            border-radius: 10px;
            max-width: 540px;
        }
        h1 { font-size: 24px; color: #38bdf8; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
        .badge {
            display: inline-block;
            background-color: #064e3b;
            color: #34d399;
            border: 1px solid #059669;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 16px;
        }
        code {
            background-color: #0b0f17;
            padding: 3px 8px;
            border-radius: 4px;
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">NATIVE JAVAFX DESKTOP PLATFORM</div>
        <h1>Ledgr Financial Intelligence</h1>
        <p>The Ledgr user interface runs natively as a high-performance <strong>JavaFX Desktop Application</strong> (no HTML/browser UI).</p>
        <p>To launch the desktop interface, run:<br><code>.\mvnw.cmd javafx:run</code> or <code>.\mvnw.cmd spring-boot:run</code></p>
        <p><a href="/api/v1" style="color: #38bdf8; text-decoration: none; font-weight: 600;">View REST API Endpoints &rarr;</a></p>
    </div>
</body>
</html>
