server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ledgr-backend
  main:
    lazy-initialization: true
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgr_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:jana}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 2000
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

banking:
  client-id: ${BANKING_API_CLIENT_ID:${PLAID_CLIENT_ID:}}
  secret: ${BANKING_API_SECRET:${PLAID_SECRET:}}
  env: ${BANKING_API_ENV:${PLAID_ENV:sandbox}}
  base-url: ${BANKING_API_BASE_URL:${PLAID_BASE_URL:https://sandbox.plaid.com}}
  institution-id: ${BANKING_INSTITUTION_ID:${PLAID_INSTITUTION_ID:ins_20}}
  webhook-url: ${BANKING_WEBHOOK_URL:${PLAID_WEBHOOK_URL:https://www.genericwebhookurl.com/webhook}}
  override-username: ${BANKING_OVERRIDE_USERNAME:${PLAID_OVERRIDE_USERNAME:user_good}}
  override-password: ${BANKING_OVERRIDE_PASSWORD:${PLAID_OVERRIDE_PASSWORD:pass_good}}
  initial-products:
    - auth
    - transactions
    - identity
    - investments
    - liabilities
  transaction-delay-ms: ${TRANSACTION_DELAY_MS:150}
